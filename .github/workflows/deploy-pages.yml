# Publica o site no GitHub Pages a cada push na main.
# Alternativa sem custo ao Netlify, que pausa os deploys de produção quando acabam os créditos.
# Para ligar: no GitHub, Settings > Pages > Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar manualmente pelo site do GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois deploys forem disparados juntos, deixa o mais novo terminar.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Gerar o site
        run: npm run build
        env:
          GITHUB_PAGES: "true" # faz o Vite usar o caminho /fn-edificacoes-frontend/

      # O Pages não conhece as rotas do app; sem isso, recarregar numa URL interna dá 404.
      - name: Tratar recarregamento de página
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
