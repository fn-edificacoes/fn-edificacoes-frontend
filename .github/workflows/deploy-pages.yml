# Publicação no GitHub Pages — HOJE DESLIGADA, mantida como caminho de volta.
#
# Desde 28/08/2026 o sistema roda no servidor da própria FN: sistema.fnedificacoes.com.br
# aponta para lá, e quem publica é deploy/atualizar.sh no repositório do backend.
#
# Este workflow não dispara mais sozinho de propósito. Se disparasse a cada push, ficaria
# gerando um site que ninguém acessa — e, pior, o GitHub Pages voltaria a reivindicar o
# domínio, brigando com o servidor.
#
# Continua aqui porque é a rota de emergência: se o servidor cair de vez, rodar este
# workflow pela aba Actions e reapontar o DNS devolve o sistema ao ar em minutos. Para isso
# funcionar, o arquivo public/CNAME precisa ser recriado com o domínio.
name: Publicar no GitHub Pages (manual, emergência)

on:
  workflow_dispatch: # só pelo botão, na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois deploys forem disparados juntos, deixa o mais novo terminar.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Gerar o site
        run: npm run build

      # O Pages não conhece as rotas do app; sem isso, recarregar numa URL interna dá 404.
      - name: Tratar recarregamento de página
        run: cp dist/index.html dist/404.html

      # enablement liga o Pages sozinho (usa o GITHUB_TOKEN e a permissão "pages: write"
      # declarada acima), então não é preciso ativar nada na mão em Settings > Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
